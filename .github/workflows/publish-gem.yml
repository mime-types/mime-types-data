name: Release

on:
  push:
    branches:
      - main
    paths:
      - lib/mime/types/data.rb

  pull_request:
    branches:
      - main
    types:
      - closed
    paths:
      - lib/mime/types/data.rb

  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Publish Gem Version with Trusted Publishing

    if: github.repository == 'mime-types/mime-types-data' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged))

    runs-on: ubuntu-latest
    environment: production

    env:
      rubygems_release_gem: true

    permissions:
      contents: write # Create a new tag
      id-token: write # Authenticate for gem publishing

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            fulcio.sigstore.dev:443
            github.com:443
            index.rubygems.org:443
            objects.githubusercontent.com:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            rubygems.org:443
            tuf-repo-cdn.sigstore.dev:443

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.FACTOTUM_APP_ID }}
          private-key: ${{ secrets.FACTOTUM_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Resolve app bot user id
        id: user-id
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          echo "user-id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)" >>"${GITHUB_OUTPUT}"

      - name: Resolve app bot identity
        id: bot
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          USER_ID: ${{ steps.user-id.outputs.user-id }}
        run: |
          {
            echo "name=${APP_SLUG}[bot]"
            echo "email=${USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          } >>"${GITHUB_OUTPUT}"

      - id: rubygems
        name: Get RubyGems version
        run: |
          ruby -e \
            'print "version=", Gem::Specification.load(ARGV[0]).rubygems_version, "\n"' \
            mime-types-data.gemspec >>"${GITHUB_OUTPUT}"

      - uses: ruby/setup-ruby@bec3f19a76460dbe12f60def7d1a77585f07516c # v1.322.0
        with:
          bundler-cache: false
          ruby-version: ruby

      - name: Install dependencies
        run: |
          gem update --system="${RUBYGEMS_VERSION}"
          bundle install --jobs 4 --retry 3
        env:
          RUBYGEMS_VERSION: ${{ steps.rubygems.outputs.version }}

      - name: Get gem version
        run: |
          echo gem_version="$(rake version)" >>"${GITHUB_OUTPUT}"

      - name: Ensure that gemspec is up-to-date
        env:
          GIT_AUTHOR_NAME: ${{ steps.bot.outputs.name }}
          GIT_AUTHOR_EMAIL: ${{ steps.bot.outputs.email }}
        run: |
          rake gemspec

          if ! git diff --quiet; then
            git config --global user.email "${GIT_AUTHOR_EMAIL}"
            git config --global user.name "${GIT_AUTHOR_NAME}"
            git add -u
            git commit --signoff -m "chore: Automatically update gemspec for ${gem_version} for release"
            git push origin main
            git log -1
          else
            echo ::notice::No gemspec changes found
          fi

          git diff

      - uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1
