name: Update data and open pull request

on:
  schedule:
    - cron: '0 18 * * 2'

  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  update-definitions:
    name: Update data and open pull request
    permissions:
      contents: write       # This workflow updates data and opens a pull request.
      issues: write         # This workflow updates data and opens a pull request.
      pull-requests: write  # This workflow updates data and opens a pull request.

    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            index.rubygems.org:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            rubygems.org:443
            svn.apache.org:80
            www.iana.org:443

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.FACTOTUM_APP_ID }}
          private-key: ${{ secrets.FACTOTUM_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Resolve app bot user id
        id: user-id
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          echo "user-id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)" >>"${GITHUB_OUTPUT}"

      - name: Resolve app bot identity
        id: bot
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          USER_ID: ${{ steps.user-id.outputs.user-id }}
        run: |
          {
            echo "name=${APP_SLUG}[bot]"
            echo "email=${USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          } >>"${GITHUB_OUTPUT}"

      - uses: ruby/setup-ruby@bec3f19a76460dbe12f60def7d1a77585f07516c # v1.322.0
        with:
          ruby-version: '4.0'
          rubygems: 'latest'
          bundler: 2
          bundler-cache: true

      - run: bundle exec rake release:gha

      - run: |
          git config --global user.email "${GIT_AUTHOR_EMAIL}"
          git config --global user.name "${GIT_AUTHOR_NAME}"

          git switch --create update-mime-types-data/"${UPDATE_VERSION}"

          printf "%s\n\n%s" "${UPDATE_TITLE}" "$(fmt -w 72 "${UPDATE_BODY_PATH}")" |
            git commit --signoff --all -F-

          git push --set-upstream origin update-mime-types-data/"${UPDATE_VERSION}"

          gh pr create --title "${UPDATE_TITLE}" \
             --body-file "${UPDATE_BODY_PATH}" \
             --assignee halostatue \
             --reviewer halostatue \
             --label automated,data-update
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_AUTHOR_NAME: ${{ steps.bot.outputs.name }}
          GIT_AUTHOR_EMAIL: ${{ steps.bot.outputs.email }}
